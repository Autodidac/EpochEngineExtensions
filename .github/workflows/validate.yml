name: Public Engine compatibility contracts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select the verified Public Engine modules
        uses: actions/checkout@v4
        with:
          repository: Autodidac/EpochEngine
          ref: 61c835459f7ed8bc72994376c6966574b0c4949c
          path: .ci-engine
          persist-credentials: false
      - name: Install pinned CMake
        shell: pwsh
        run: |
          python -m venv .ci-tools
          .ci-tools/Scripts/python -m pip install cmake==4.4.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure the complete optional source owner
        run: .ci-tools/Scripts/cmake -S . -B out -G "Visual Studio 17 2022" -A x64 -DEPOCH_ENGINE_MODULE_DIR=${{ github.workspace }}/.ci-engine/Engine/modules -DBUILD_TESTING=ON -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
      - name: Build
        run: .ci-tools/Scripts/cmake --build out --config ${{ matrix.config }} --parallel 1 -- /nodeReuse:false
      - name: CPU contracts
        run: .ci-tools/Scripts/ctest --test-dir out -C ${{ matrix.config }} --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-${{ matrix.config }}-contracts
          path: out/Testing/Temporary/LastTest.log
          if-no-files-found: warn
